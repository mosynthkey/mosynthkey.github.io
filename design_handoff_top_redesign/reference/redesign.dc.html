<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0d; }
    a { color: #82ABE3; text-decoration: none; }
    a:hover { color: #b0cbf0; }
  </style>
</helmet>

<div style="position:fixed; inset:0; background:#0a0a0d; font-family:'Manrope',sans-serif; color:#F2F2ED; overflow:hidden;">

  <div style="position:absolute; inset:0; z-index:0;">
    <sc-for list="{{ bgLayers }}" as="bg" hint-placeholder-count="6">
      <div style="position:absolute; inset:0; transition:opacity 0.4s ease;">
        <image-slot id="{{ bg.iconId }}" shape="rect" src="{{ bg.src }}" placeholder="{{ bg.name }} の画像" style="width:100%; height:100%; object-fit:cover; opacity:{{ bg.opacity }};"></image-slot>
      </div>
    </sc-for>
    <div style="position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(10,10,13,0.25) 0%, rgba(10,10,13,0.55) 55%, rgba(10,10,13,0.97) 100%); pointer-events:none;"></div>
  </div>

  <nav style="position:absolute; top:0; left:0; width:100%; box-sizing:border-box; padding:22px 44px; display:flex; align-items:center; justify-content:space-between; z-index:50; background:rgba(10,10,13,0.35); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,0.06);">
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="https://mosynthkey.github.io/assets/melissa-audio-logo-BvWsNWe_.svg" alt="Melissa Audio" style="height:22px;">
      <span style="color:#7C7C84; font-size:12px;">{{ t.footer }}</span>
    </div>
    <button onclick="{{ toggleLang }}" style="font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.04em; color:#F2F2ED; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:9px 18px; cursor:pointer;" style-hover="background:rgba(255,255,255,0.16);">{{ t.langLabel }}</button>
  </nav>

  <div style="position:absolute; z-index:2; left:0; bottom:0; width:100%; box-sizing:border-box; padding:0 60px 150px; max-width:900px;">
    <div style="display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:20px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); backdrop-filter:blur(10px); font-size:13px; font-weight:600; letter-spacing:0.03em; color:#82ABE3; width:fit-content; margin-bottom:22px;">{{ current.platformsLabel }}</div>
    <h1 style="font-family:'Space Grotesk',sans-serif; font-size:clamp(32px,5.2vw,72px); line-height:1.1; font-weight:700; margin:0 0 20px; letter-spacing:-0.02em;">{{ current.name }}</h1>
    <p style="font-size:18px; line-height:1.7; color:#C7C7CE; max-width:520px; margin:0 0 34px;">{{ current.desc }}</p>
    <div style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="{{ current.url }}" target="_blank" style="display:inline-flex; align-items:center; gap:8px; background:#82ABE3; color:#0a0a0d; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; padding:15px 26px; border-radius:14px;" style-hover="background:#b0cbf0;">{{ t.heroCta }} ↗</a>
    </div>
  </div>

  <div style="position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:60; display:flex; align-items:flex-end; gap:14px; padding:12px 18px; border-radius:26px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); backdrop-filter:blur(24px); box-shadow:0 20px 50px rgba(0,0,0,0.5);">
    <sc-for list="{{ dock }}" as="d" hint-placeholder-count="6">
      <button onclick="{{ d.onSelect }}" onmouseenter="{{ d.onEnter }}" onmouseleave="{{ d.onLeave }}" style="position:relative; display:flex; flex-direction:column; align-items:center; background:none; border:none; padding:0; cursor:pointer;">
        <sc-if value="{{ d.hovered }}">
          <span style="position:absolute; bottom:66px; left:50%; transform:translateX(-50%); background:rgba(20,20,24,0.95); border:1px solid rgba(255,255,255,0.14); color:#F2F2ED; font-size:12px; font-weight:600; padding:6px 12px; border-radius:8px; white-space:nowrap;">{{ d.label }}</span>
        </sc-if>
        <image-slot id="{{ d.iconId }}" shape="rounded" radius="13" src="{{ d.iconSrc }}" placeholder="{{ d.name }}" style="width:{{ d.size }}px; height:{{ d.size }}px; box-shadow:{{ d.ring }}; transition:width 0.15s,height 0.15s,box-shadow 0.15s;"></image-slot>
      </button>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'ja', hoverDock: null, selected: 1 };
    this.toggleLang = this.toggleLang.bind(this);
    this.PRODUCTS = [
      { key:'wavy', name:'Wavy', platforms:['iOS'], url:'https://apps.apple.com/jp/app/wavy-music-video-studio/id6753092962', bgSrc:'',
        jaDesc:'音源とジャケット画像からかっこいい動画を作成するiOSアプリ。',
        enDesc:'Create a great-looking music video from a track and its artwork, right on iOS.' },
      { key:'melissa', name:'Melissa', platforms:['Windows','macOS'], url:'https://mosynthkey.github.io/Melissa/', bgSrc:'https://mosynthkey.github.io/Melissa/images/function/all.gif',
        jaDesc:'AI音源分離機能搭載の楽器練習/耳コピ用のミュージックプレイヤー。',
        enDesc:'A music player for instrument practice and ear-training, with AI-powered stem separation.' },
      { key:'screendesc', name:'ScreenDesc', platforms:['Web','Windows','macOS'], url:'https://mosynthkey.github.io/ScreenDesc/landing/', bgSrc:'',
        jaDesc:'AIによるUI認識とOCRを搭載した、アプリやソフトの説明画像制作のためのスクリーンショット注釈ツール。',
        enDesc:'A screenshot annotation tool for app/software documentation, powered by AI UI recognition and OCR.' },
      { key:'volcafm2', name:'volca fm2 Utility', platforms:['Web App'], url:'https://mosynthkey.github.io/volcafm2-dx7/', bgSrc:'',
        jaDesc:'KORG volca fm2 プログラムを受信して DX7 SysEx として保存するユーティリティ。',
        enDesc:'Receives KORG volca fm2 programs and saves them as DX7 SysEx.' },
      { key:'modx', name:'MODX Liveset Utility', platforms:['Web App'], url:'https://mosynthkey.github.io/MODX_Liveset_Utility/', bgSrc:'',
        jaDesc:'YAMAHA MODX LiveSet マネージャ。',
        enDesc:'A LiveSet manager for the YAMAHA MODX.' },
      { key:'fastudio', name:'FA StudioSetEditor', platforms:['Web App'], url:'https://mosynthkey.github.io/FA-StudioSetEditor/index.html', bgSrc:'',
        jaDesc:'Roland FAシリーズ用 Studio Set エディタ。',
        enDesc:'A Studio Set editor for the Roland FA series.' },
    ];
    this.TEXTS = {
      ja: { langLabel: 'EN', heroCta: '開く', footer: '© 2026 Melissa Audio' },
      en: { langLabel: '日本語', heroCta: 'Open', footer: '© 2026 Melissa Audio' },
    };
  }

  toggleLang() {
    this.setState(function (s) { return { lang: s.lang === 'ja' ? 'en' : 'ja' }; });
  }

  renderVals() {
    var self = this;
    var lang = this.state.lang;
    var t = this.TEXTS[lang];
    var selected = this.state.selected;

    var current = (function () {
      var p = self.PRODUCTS[selected];
      return {
        name: p.name,
        desc: lang === 'ja' ? p.jaDesc : p.enDesc,
        url: p.url,
        platformsLabel: p.platforms.join(' / '),
      };
    })();

    var bgLayers = this.PRODUCTS.map(function (p, i) {
      return {
        iconId: 'bg-' + p.key,
        name: p.name,
        src: p.bgSrc,
        opacity: i === selected ? 1 : 0,
      };
    });

    var dock = this.PRODUCTS.map(function (p, i) {
      var isSelected = i === selected;
      return {
        key: p.key,
        name: p.name,
        label: p.name,
        iconId: 'dock-icon-' + p.key,
        iconSrc: '',
        hovered: self.state.hoverDock === i,
        size: self.state.hoverDock === i ? 62 : 52,
        ring: isSelected ? '0 0 0 2px #82ABE3' : 'none',
        onSelect: function () { self.setState({ selected: i }); },
        onEnter: function () { self.setState({ hoverDock: i }); },
        onLeave: function () { self.setState({ hoverDock: null }); },
      };
    });

    return { lang: lang, t: t, current: current, bgLayers: bgLayers, dock: dock, toggleLang: this.toggleLang };
  }
}
</script>
</body>
</html>
